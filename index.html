<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>30-Day Program</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --lower:    #3D2B6B;
    --lower-l:  #EDE7F6;
    --lower-m:  #B39DDB;
    --upper:    #0D3B6E;
    --upper-l:  #E3F0FB;
    --upper-m:  #90CAF9;
    --cardio:   #7B1C1C;
    --cardio-l: #FDECEA;
    --cardio-m: #EF9A9A;
    --rest:     #1B5E20;
    --rest-l:   #E8F5E9;
    --rest-m:   #A5D6A7;
    --gold:     #C8790A;
    --gold-l:   #FFF8E1;
    --bg:       #F7F6F3;
    --surface:  #FFFFFF;
    --border:   #E5E2DC;
    --text:     #1A1A1A;
    --text-2:   #5A5A5A;
    --text-3:   #9A9A9A;
    --nn-bg:    #E8F5E9;
    --nn-text:  #1B5E20;
    --radius:   16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 100px;
  }

  /* ── Header ── */
  .app-header {
    background: var(--text);
    color: white;
    padding: 52px 20px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.15);
  }
  .app-header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .app-header .subtitle {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.6);
    margin-top: 3px;
    font-weight: 300;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .nn-banner {
    background: var(--nn-bg);
    color: var(--nn-text);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 8px 20px;
    display: flex;
    gap: 16px;
    border-bottom: 1px solid #C8E6C9;
  }

  /* ── Week nav ── */
  .week-nav {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 97px;
    z-index: 99;
  }
  .week-nav::-webkit-scrollbar { display: none; }
  .week-btn {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.2s;
  }
  .week-btn.active {
    background: var(--text);
    color: white;
    border-color: var(--text);
  }

  /* ── Week view ── */
  .week-view { padding: 16px 16px 0; }

  .week-progress {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .week-progress-label {
    font-size: 0.75rem;
    color: var(--text-2);
    font-weight: 500;
    flex-shrink: 0;
  }
  .progress-bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-pct {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--gold);
    flex-shrink: 0;
    min-width: 32px;
    text-align: right;
  }

  /* ── Day cards ── */
  .day-card {
    background: var(--surface);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: box-shadow 0.2s;
  }
  .day-card.completed { opacity: 0.75; }

  .day-header {
    display: flex;
    align-items: center;
    padding: 13px 16px;
    cursor: pointer;
    user-select: none;
    gap: 12px;
  }
  .day-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
  }
  .day-info { flex: 1; }
  .day-dow {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-3);
  }
  .day-type {
    font-family: 'DM Serif Display', serif;
    font-size: 1.05rem;
    line-height: 1.2;
  }
  .day-num {
    font-size: 0.7rem;
    color: var(--text-3);
    font-weight: 400;
  }
  .day-chevron {
    font-size: 0.7rem;
    color: var(--text-3);
    transition: transform 0.25s;
    flex-shrink: 0;
  }
  .day-card.open .day-chevron { transform: rotate(180deg); }
  .day-complete-pill {
    background: #E8F5E9;
    color: #2E7D32;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  /* Type-specific colors */
  .lower .day-icon  { background: var(--lower-l); }
  .lower .day-type  { color: var(--lower); }
  .lower .day-header { border-left: 4px solid var(--lower); }
  .upper .day-icon  { background: var(--upper-l); }
  .upper .day-type  { color: var(--upper); }
  .upper .day-header { border-left: 4px solid var(--upper); }
  .cardio .day-icon { background: var(--cardio-l); }
  .cardio .day-type { color: var(--cardio); }
  .cardio .day-header { border-left: 4px solid var(--cardio); }
  .rest .day-icon   { background: var(--rest-l); }
  .rest .day-type   { color: var(--rest); }
  .rest .day-header { border-left: 4px solid var(--rest); }

  /* ── Day body ── */
  .day-body { display: none; border-top: 1px solid var(--border); }
  .day-card.open .day-body { display: block; }

  /* ── Exercise rows ── */
  .ex-section-label {
    padding: 10px 16px 4px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-3);
  }
  .ex-row {
    display: flex;
    align-items: flex-start;
    padding: 10px 16px;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .ex-row:last-of-type { border-bottom: none; }
  .ex-check {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    margin-top: 1px;
  }
  .ex-check.checked {
    border-color: transparent;
    color: white;
    font-size: 0.7rem;
  }
  .lower .ex-check.checked  { background: var(--lower); }
  .upper .ex-check.checked  { background: var(--upper); }
  .cardio .ex-check.checked { background: var(--cardio); }
  .rest .ex-check.checked   { background: var(--rest); }

  .ex-info { flex: 1; min-width: 0; }
  .ex-name {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .ex-name.compound { font-weight: 700; }
  .ex-meta {
    font-size: 0.72rem;
    color: var(--text-2);
    margin-top: 1px;
  }
  .ex-log-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .ex-log-btn.has-log {
    color: var(--gold);
    border-color: var(--gold);
    background: var(--gold-l);
    font-weight: 700;
  }
  .ex-row.done .ex-name { text-decoration: line-through; color: var(--text-3); }
  .ex-row.done .ex-meta { color: var(--text-3); }

  /* Rest day content */
  .rest-list {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rest-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.83rem;
    color: var(--rest);
    font-weight: 500;
  }
  .rest-item span { font-size: 1rem; }

  /* ── Complete button ── */
  .complete-btn {
    margin: 14px 16px;
    width: calc(100% - 32px);
    padding: 14px;
    border-radius: var(--radius-sm);
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .lower  .complete-btn { background: var(--lower);  color: white; }
  .upper  .complete-btn { background: var(--upper);  color: white; }
  .cardio .complete-btn { background: var(--cardio); color: white; }
  .rest   .complete-btn { background: var(--rest);   color: white; }
  .complete-btn:active { transform: scale(0.98); }
  .complete-btn.done { opacity: 0.5; }

  /* ── Weekly notes ── */
  .notes-section {
    background: var(--surface);
    border-radius: var(--radius);
    margin-bottom: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .notes-header {
    background: #2B3A4A;
    color: white;
    padding: 12px 16px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .notes-body { display: none; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .note-field label {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--text-3);
    margin-bottom: 5px;
  }
  .note-field textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.83rem;
    color: var(--text);
    background: var(--bg);
    resize: none;
    height: 62px;
    transition: border-color 0.2s;
    outline: none;
  }
  .note-field textarea:focus { border-color: #2B3A4A; }

  /* ── Log modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 8px 20px 40px;
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.3s cubic-bezier(.16,1,.3,1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 10px auto 18px;
  }
  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem;
    margin-bottom: 4px;
  }
  .modal-sub {
    font-size: 0.75rem;
    color: var(--text-2);
    margin-bottom: 20px;
  }
  .log-sets { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .log-set-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .set-num {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-3);
    width: 38px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .log-input-wrap {
    flex: 1;
    display: flex;
    gap: 8px;
  }
  .log-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    background: var(--bg);
  }
  .log-input:focus { border-color: var(--gold); }
  .log-input-label {
    font-size: 0.65rem;
    color: var(--text-3);
    text-align: center;
    margin-top: 3px;
    font-weight: 500;
  }
  .log-input-grp { flex: 1; }
  .modal-save {
    width: 100%;
    padding: 15px;
    background: var(--text);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    letter-spacing: 0.3px;
  }
  .modal-save:active { opacity: 0.8; }
  .modal-close-x {
    position: absolute;
    top: 16px;
    right: 20px;
    background: var(--border);
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 0.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
  }

  /* ── Bottom nav ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 0 24px;
    z-index: 100;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
  }
  .nav-btn .nav-icon { font-size: 1.3rem; }
  .nav-btn .nav-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.62rem;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .nav-btn.active .nav-label { color: var(--text); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1A1A1A;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 300;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app-header">
  <h1>30-Day Program</h1>
  <div class="subtitle">Lower · Upper · Cardio</div>
</div>
<div class="nn-banner">
  <span>⚡ 10,000 Steps Daily</span>
  <span>🥩 Protein Every Meal</span>
</div>

<div class="week-nav" id="weekNav"></div>
<div id="mainView"></div>

<!-- Log Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalIfOutside(event)">
  <div class="modal" style="position:relative">
    <div class="modal-handle"></div>
    <button class="modal-close-x" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="log-sets" id="logSets"></div>
    <button class="modal-save" onclick="saveLog()">Save Log</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──
const LOWER = [
  { name:"Barbell RDL",        sets:4, reps:"8–10",    load:"75–105 lbs", compound:true },
  { name:"DB Glute Bridge",    sets:4, reps:"12–15",   load:"35–50 lbs",  compound:true },
  { name:"Step-Ups (DB)",      sets:3, reps:"10–12 ea",load:"15–25 lbs ea",compound:false },
  { name:"KB Swings",          sets:4, reps:"15",       load:"25–35 lbs",  compound:false },
  { name:"Skier Jumps",        sets:3, reps:"20 sec",   load:"Bodyweight", compound:false },
];
const UPPER = [
  { name:"Barbell Bent-Over Row", sets:4, reps:"8–10",    load:"65–85 lbs",   compound:true },
  { name:"Single-Arm DB Row",     sets:3, reps:"10–12 ea",load:"25–40 lbs",    compound:true },
  { name:"DB Overhead Press",     sets:3, reps:"10–12",   load:"15–25 lbs ea", compound:false },
  { name:"DB Romanian DL→Row",    sets:3, reps:"10",       load:"25–35 lbs ea", compound:false },
  { name:"Face Pulls (band)",     sets:3, reps:"15–20",   load:"Light–med band",compound:false },
  { name:"DB Lateral Raise",      sets:3, reps:"12–15",   load:"8–15 lbs ea",  compound:false },
  { name:"DB Bicep Curl",         sets:3, reps:"10–12",   load:"15–25 lbs ea", compound:false },
  { name:"Tri Overhead Ext",      sets:3, reps:"12",       load:"15–25 lbs ea", compound:false },
];
const CARDIO = [
  { name:"Warm-up Walk",       sets:1, reps:"5 min",   load:"Easy pace",     compound:false },
  { name:"Walk/Jog Intervals", sets:6, reps:"2 min walk + 1 min jog", load:"Conversational", compound:true },
  { name:"Cool-down Walk",     sets:1, reps:"5 min",   load:"Easy pace",     compound:false },
];
const REST_ITEMS = [
  "Hit your 10,000 steps",
  "10–15 min light stretch / mobility",
  "7–9 hrs sleep tonight",
  "Hydrate — ½ oz per lb bodyweight",
  "Prep protein meals for tomorrow",
];

// Mon=Lower, Tue=Rest, Wed=Upper, Thu=Rest, Fri=Cardio, Sat=Rest, Sun=Rest
const WEEK_PATTERN = [
  { type:"LOWER",  dow:"Monday",    icon:"🦵", cls:"lower"  },
  { type:"REST",   dow:"Tuesday",   icon:"😴", cls:"rest"   },
  { type:"UPPER",  dow:"Wednesday", icon:"💪", cls:"upper"  },
  { type:"REST",   dow:"Thursday",  icon:"😴", cls:"rest"   },
  { type:"CARDIO", dow:"Friday",    icon:"🏃", cls:"cardio" },
  { type:"REST",   dow:"Saturday",  icon:"😴", cls:"rest"   },
  { type:"REST",   dow:"Sunday",    icon:"😴", cls:"rest"   },
];

const TYPE_LABEL = { LOWER:"Lower Body", UPPER:"Upper Body", CARDIO:"Cardio", REST:"Rest Day" };
const EX_MAP = { LOWER, UPPER, CARDIO };

// ── STATE ──
function loadState() {
  try { return JSON.parse(localStorage.getItem('wt_state') || '{}'); } catch { return {}; }
}
function saveState(s) {
  localStorage.setItem('wt_state', JSON.stringify(s));
}
let state = loadState();
let currentWeek = 1;
let modalMeta = null;

function key(...parts) { return parts.join('_'); }

// ── RENDER ──
function renderWeekNav() {
  const nav = document.getElementById('weekNav');
  nav.innerHTML = '';
  for (let w = 1; w <= 5; w++) {
    const btn = document.createElement('button');
    btn.className = 'week-btn' + (w === currentWeek ? ' active' : '');
    btn.textContent = `Week ${w}`;
    btn.onclick = () => { currentWeek = w; renderAll(); };
    nav.appendChild(btn);
  }
}

function calcWeekPct(week) {
  const total = WEEK_PATTERN.filter(d => d.type !== 'REST').length;
  let done = 0;
  WEEK_PATTERN.forEach((day, di) => {
    if (day.type !== 'REST' && state[key(week, di, 'done')]) done++;
  });
  return Math.round((done / total) * 100);
}

function renderMain() {
  const view = document.getElementById('mainView');
  const pct = calcWeekPct(currentWeek);
  const startDay = (currentWeek - 1) * 7 + 1;

  let html = `<div class="week-view">`;

  // Progress bar
  html += `<div class="week-progress">
    <div class="week-progress-label">Week ${currentWeek}</div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="progress-pct">${pct}%</div>
  </div>`;

  // Day cards
  WEEK_PATTERN.forEach((day, di) => {
    const dayNum = startDay + di;
    const isDone = !!state[key(currentWeek, di, 'done')];
    const openKey = key('open', currentWeek, di);
    const isOpen = !!state[openKey];
    const exs = EX_MAP[day.type] || [];

    html += `<div class="day-card ${day.cls}${isDone?' completed':''}${isOpen?' open':''}" id="card_${di}">
      <div class="day-header" onclick="toggleCard(${di})">
        <div class="day-icon">${day.icon}</div>
        <div class="day-info">
          <div class="day-dow">${day.dow}</div>
          <div class="day-type">${TYPE_LABEL[day.type]}</div>
          <div class="day-num">Day ${dayNum}</div>
        </div>
        ${isDone ? '<div class="day-complete-pill">✓ Done</div>' : ''}
        <div class="day-chevron">▼</div>
      </div>
      <div class="day-body">`;

    if (day.type === 'REST') {
      html += `<div class="rest-list">`;
      REST_ITEMS.forEach(tip => {
        html += `<div class="rest-item"><span>✓</span>${tip}</div>`;
      });
      html += `</div>`;
    } else {
      const isCompound = exs.filter(e => e.compound);
      const isAcc = exs.filter(e => !e.compound);

      if (isCompound.length) {
        html += `<div class="ex-section-label">Main Lifts</div>`;
        isCompound.forEach((ex, ei) => {
          const exIdx = exs.indexOf(ex);
          const checked = !!state[key(currentWeek, di, exIdx)];
          const logData = state[key(currentWeek, di, exIdx, 'log')];
          const hasLog = logData && logData.length > 0;
          html += buildExRow(day, di, exIdx, ex, checked, hasLog);
        });
      }
      if (isAcc.length) {
        html += `<div class="ex-section-label">Accessories</div>`;
        isAcc.forEach((ex) => {
          const exIdx = exs.indexOf(ex);
          const checked = !!state[key(currentWeek, di, exIdx)];
          const logData = state[key(currentWeek, di, exIdx, 'log')];
          const hasLog = logData && logData.length > 0;
          html += buildExRow(day, di, exIdx, ex, checked, hasLog);
        });
      }
    }

    const btnLabel = isDone ? '✓ Day Complete' : (day.type === 'REST' ? 'Mark Rest Day Done' : 'Mark Day Complete');
    html += `<button class="complete-btn${isDone?' done':''}" onclick="markDayDone(${di})">${btnLabel}</button>
      </div>
    </div>`;
  });

  // Weekly Notes
  const noteKeys = ['felt','well','improve','next'];
  const noteLabels = ['How I felt this week','What went well','What to improve','Goals for next week'];
  html += `<div class="notes-section">
    <div class="notes-header">📝 &nbsp;Weekly Notes</div>
    <div class="notes-body">`;
  noteKeys.forEach((nk, ni) => {
    const val = state[key(currentWeek, 'note', nk)] || '';
    html += `<div class="note-field">
      <label>${noteLabels[ni]}</label>
      <textarea placeholder="Write here..." onblur="saveNote(${currentWeek},'${nk}',this.value)">${val}</textarea>
    </div>`;
  });
  html += `</div></div></div>`;

  view.innerHTML = html;
}

function buildExRow(day, di, exIdx, ex, checked, hasLog) {
  const logData = state[key(currentWeek, di, exIdx, 'log')];
  const logLabel = hasLog ? `${logData[0].weight}lbs` : 'Log';
  return `<div class="ex-row${checked?' done':''}" id="exrow_${di}_${exIdx}">
    <div class="ex-check${checked?' checked':''}" onclick="toggleEx(${di},${exIdx})">${checked?'✓':''}</div>
    <div class="ex-info">
      <div class="ex-name${ex.compound?' compound':''}">${ex.name}</div>
      <div class="ex-meta">${ex.sets === 1 ? '' : ex.sets+'×'} ${ex.reps} &nbsp;·&nbsp; ${ex.load}</div>
    </div>
    ${day.type !== 'CARDIO' || ex.compound
      ? `<button class="ex-log-btn${hasLog?' has-log':''}" onclick="openLog(${di},${exIdx})">${logLabel}</button>`
      : ''}
  </div>`;
}

function renderAll() {
  renderWeekNav();
  renderMain();
}

// ── INTERACTIONS ──
function toggleCard(di) {
  const k = key('open', currentWeek, di);
  state[k] = !state[k];
  saveState(state);
  renderAll();
}

function toggleEx(di, exIdx) {
  const k = key(currentWeek, di, exIdx);
  state[k] = !state[k];
  saveState(state);
  // re-render just that row
  const exs = EX_MAP[WEEK_PATTERN[di].type] || [];
  const ex = exs[exIdx];
  const day = WEEK_PATTERN[di];
  const checked = !!state[k];
  const logData = state[key(currentWeek, di, exIdx, 'log')];
  const hasLog = !!(logData && logData.length);
  const row = document.getElementById(`exrow_${di}_${exIdx}`);
  if (row) {
    row.outerHTML = buildExRow(day, di, exIdx, ex, checked, hasLog);
  }
}

function markDayDone(di) {
  const k = key(currentWeek, di, 'done');
  state[k] = !state[k];
  saveState(state);
  showToast(state[k] ? '🎉 Day marked complete!' : 'Day unmarked');
  renderAll();
}

function saveNote(week, nk, val) {
  state[key(week, 'note', nk)] = val;
  saveState(state);
}

// ── LOG MODAL ──
function openLog(di, exIdx) {
  const day = WEEK_PATTERN[di];
  const exs = EX_MAP[day.type] || [];
  const ex = exs[exIdx];
  modalMeta = { di, exIdx, ex };

  document.getElementById('modalTitle').textContent = ex.name;
  document.getElementById('modalSub').textContent = `${ex.sets} sets · ${ex.reps} · ${ex.load}`;

  const existing = state[key(currentWeek, di, exIdx, 'log')] || [];
  let setsHtml = '';
  for (let s = 0; s < ex.sets; s++) {
    const prev = existing[s] || {};
    setsHtml += `<div class="log-set-row">
      <div class="set-num">Set ${s+1}</div>
      <div class="log-input-wrap">
        <div class="log-input-grp">
          <input class="log-input" type="number" inputmode="decimal" placeholder="lbs" value="${prev.weight||''}" id="log_w_${s}">
          <div class="log-input-label">Weight (lbs)</div>
        </div>
        <div class="log-input-grp">
          <input class="log-input" type="number" inputmode="numeric" placeholder="reps" value="${prev.reps||''}" id="log_r_${s}">
          <div class="log-input-label">Reps</div>
        </div>
      </div>
    </div>`;
  }
  document.getElementById('logSets').innerHTML = setsHtml;
  document.getElementById('modalOverlay').classList.add('open');
}

function saveLog() {
  const { di, exIdx, ex } = modalMeta;
  const logs = [];
  for (let s = 0; s < ex.sets; s++) {
    const w = document.getElementById(`log_w_${s}`)?.value;
    const r = document.getElementById(`log_r_${s}`)?.value;
    logs.push({ weight: w || '', reps: r || '' });
  }
  state[key(currentWeek, di, exIdx, 'log')] = logs;
  saveState(state);
  closeModal();
  showToast('✓ Log saved');
  renderAll();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
function closeModalIfOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── INIT ──
renderAll();
</script>
</body>
</html>
